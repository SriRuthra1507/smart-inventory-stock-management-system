openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Smart Inventory Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product inventory operations
  - name: dashboard
    description: Dashboard analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      description: Returns paginated list of products with optional search and filter
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or SKU
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: lowStock
          in: query
          schema:
            type: boolean
          description: Filter to show only low stock items
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, price, quantity, createdAt]
          description: Field to sort by
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort direction
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      description: Returns total products, total stock value, low stock count, and out of stock count
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/categories:
    get:
      operationId: getCategoryBreakdown
      tags: [dashboard]
      summary: Get product count and value per category
      responses:
        "200":
          description: Category breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryStat"

  /dashboard/low-stock:
    get:
      operationId: getLowStockProducts
      tags: [dashboard]
      summary: Get products below reorder threshold
      responses:
        "200":
          description: Low stock products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /dashboard/recent:
    get:
      operationId: getRecentProducts
      tags: [dashboard]
      summary: Get recently added products
      responses:
        "200":
          description: Recent products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Product:
      type: object
      required: [id, name, sku, category, quantity, price, reorderThreshold, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        quantity:
          type: integer
        price:
          type: number
        reorderThreshold:
          type: integer
        supplier:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ProductInput:
      type: object
      required: [name, sku, category, quantity, price, reorderThreshold]
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        quantity:
          type: integer
          minimum: 0
        price:
          type: number
          minimum: 0
        reorderThreshold:
          type: integer
          minimum: 0
        supplier:
          type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        quantity:
          type: integer
          minimum: 0
        price:
          type: number
          minimum: 0
        reorderThreshold:
          type: integer
          minimum: 0
        supplier:
          type: string

    DashboardSummary:
      type: object
      required: [totalProducts, totalStockValue, lowStockCount, outOfStockCount, totalQuantity]
      properties:
        totalProducts:
          type: integer
        totalStockValue:
          type: number
        lowStockCount:
          type: integer
        outOfStockCount:
          type: integer
        totalQuantity:
          type: integer

    CategoryStat:
      type: object
      required: [category, productCount, totalValue, totalQuantity]
      properties:
        category:
          type: string
        productCount:
          type: integer
        totalValue:
          type: number
        totalQuantity:
          type: integer
